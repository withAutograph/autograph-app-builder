[tools]
"aqua:docker/buildx" = "0.33.0"
docker-cli = "29.4.0"
gh = "2.98.0"
"npm:microsandbox" = "0.5.10"
"npm:@openai/codex" = "0.153.4"
node = "24.18.0"
pnpm = "11.7.0"
"npm:vercel" = "59.10.0"

[settings]
experimental = true

[tasks."test:handoff-e2e"]
description = "Run handoff browser acceptance with isolated local emulator ports"
run = "mise run auth-e2e:test -- e2e/builder/builder-handoff.spec.ts e2e/auth/client-oauth-handoff.spec.ts"
env = { APP_BUILDER_LOCAL_PORT = "3101", APP_BUILDER_DATABASE_PORT = "54339", EMULATE_BASE_PORT = "4100" }
