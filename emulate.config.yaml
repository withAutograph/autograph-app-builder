tokens:
  emulate_local_provider_token:
    login: autograph-dev
    scopes: [repo, user]
vercel:
  users:
    - username: autograph-dev
      name: Autograph Developer
      email: dev@autograph.local
  teams:
    - id: team_local_1
      slug: autograph-local
      name: Autograph Local
  integrations:
    - client_id: local-vercel-client
      client_secret: local-vercel-client-secret
      name: Autograph App Builder Local
      redirect_uris: ["https://localhost:3000/vercel/installations/callback"]
github:
  users:
    - login: autograph-dev
      name: Autograph Developer
      email: dev@autograph.local
  orgs:
    - login: autograph-local
      name: Autograph Local
  repos:
    - owner: autograph-local
      name: demo-app
      auto_init: true
  apps:
    - app_id: 12345
      slug: autograph-app-builder
      name: Autograph App Builder Local
      installations:
        - installation_id: 1001
          account: autograph-local
          repository_selection: selected
          repositories: [autograph-local/demo-app]
