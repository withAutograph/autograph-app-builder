name: App Builder self-reproduction

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: self-reproduction
    env:
      SELF_REPRODUCTION_CONTROLLER_URL: ${{ vars.SELF_REPRODUCTION_CONTROLLER_URL }}
      SELF_REPRODUCTION_GITHUB_AUDIENCE: ${{ vars.SELF_REPRODUCTION_GITHUB_AUDIENCE }}
      SELF_REPRODUCTION_OUTPUT_DIR: ${{ runner.temp }}/app-builder-self-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Run live eval through project OIDC controller
        run: node scripts/hosted-self-reproduction-client.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-builder-self-reproduction-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-builder-self-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
