name: Release Agent Plugin

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - name: Require tag and manifest version agreement
        run: |
          version="$(node -p 'require("./plugin.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build deterministic endpoint-bound release
        env:
          RELEASE_ORIGIN: ${{ vars.AUTOGRAPH_APP_BUILDER_RELEASE_ORIGIN }}
        run: |
          test -n "$RELEASE_ORIGIN"
          mise run package:build-portable-release -- \
            --endpoint "$RELEASE_ORIGIN" \
            --output .artifacts/release
          mise run package:test-portable
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Autograph App Builder $GITHUB_REF_NAME" \
            --generate-notes \
            .artifacts/release/autograph-app-builder-*.tar.gz \
            .artifacts/release/release-receipt.json \
            .artifacts/release/SHA256SUMS
