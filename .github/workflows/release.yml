name: Verify promoted Agent Plugin release

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Require exact-main release authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$main_commit" = "$tag_commit"
          test "${{ github.event.release.draft }}" = false
          test "${{ github.event.release.prerelease }}" = true
          ci_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$tag_commit" --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          test "$ci_sha" = "$tag_commit"
      - name: Download already-promoted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir .artifacts/promoted-release
      - name: Verify promoted package bytes and bindings
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { readdirSync, readFileSync } = require("node:fs");
          const { basename, join } = require("node:path");

          const root = ".artifacts/promoted-release";
          const digest = (path) => `sha256:${createHash("sha256").update(readFileSync(path)).digest("hex")}`;
          const promotion = JSON.parse(readFileSync(join(root, "promotion-receipt.json"), "utf8"));
          const packageReceipt = JSON.parse(readFileSync(join(root, "release-receipt.json"), "utf8"));
          const tagCommit = execFileSync("git", ["rev-parse", "HEAD^{commit}"], { encoding: "utf8" }).trim();

          if (promotion.format !== "autograph-release-promotion-v1") throw new Error("unexpected promotion receipt format");
          if (promotion.builder.commit !== tagCommit) throw new Error("promotion is not bound to the release commit");
          if (promotion.bindings.execution !== "release" || promotion.bindings.oauth !== "hosted" || promotion.bindings.endpoint !== "deployed" || promotion.bindings.marketplace !== "release" || promotion.bindings.deployment !== "production") {
            throw new Error("non-release bindings are forbidden");
          }
          if (packageReceipt.source.sha !== promotion.builder.commit || packageReceipt.source.tree !== promotion.builder.tree) {
            throw new Error("package receipt source does not match the promotion receipt");
          }
          if (packageReceipt.endpoint !== promotion.endpoint) throw new Error("package endpoint does not match deployment binding");
          if (packageReceipt.version !== promotion.package.version) throw new Error("package version does not match promotion binding");

          const expectedTools = ["autograph_start", "autograph_get", "autograph_send", "autograph_respond", "autograph_cancel"];
          if (JSON.stringify(packageReceipt.tools) !== JSON.stringify(expectedTools)) throw new Error("public tool contract is not exact");

          const expected = [
            promotion.package.archive,
            promotion.package.marketplaceArchive,
            promotion.package.checksums,
            promotion.package.receipt,
            "promotion-receipt.json",
          ].map(basename).sort();
          const actual = readdirSync(root).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`unexpected release assets: ${actual.join(", ")}`);

          for (const [file, expectedDigest] of [
            [promotion.package.archive, promotion.package.archiveSha256],
            [promotion.package.marketplaceArchive, promotion.package.marketplaceArchiveSha256],
            [promotion.package.checksums, promotion.package.checksumsSha256],
            [promotion.package.receipt, promotion.package.receiptSha256],
          ]) {
            if (digest(join(root, basename(file))) !== `sha256:${expectedDigest}`) throw new Error(`digest mismatch for ${file}`);
          }
          NODE
      - name: Verify immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft | not) and .isPrerelease')" = true
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for asset in .artifacts/promoted-release/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
          done
