name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  attestations: write
  contents: read
  deployments: read
  id-token: write

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run storybook:install-browser
      - run: mise run ci-repository

  eve-general:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-eve-general

  product-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run storybook:install-browser
      - run: mise run ci-product-quality
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: app-builder-product-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/product-quality
          if-no-files-found: warn

  eve-fresh-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-eve-fresh-bootstrap

  sandbox-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-sandbox-toolchain

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-package-build

  auth-e2e-emulated:
    runs-on: ubuntu-latest
    env:
      APP_BUILDER_DATABASE_PORT: "54329"
      APP_BUILDER_EXTERNAL_DATABASE: "1"
    services:
      postgres:
        image: postgres@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: autograph_app_builder
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autograph_app_builder"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-auth-e2e-emulated

  vercel-preview:
    name: Vercel deployment proof
    runs-on: ubuntu-latest
    steps:
      - name: Require exact Vercel Git deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
        run: |
          set -eu
          attempt=0
          deployment_id=
          deployment_url=
          while [ "$attempt" -lt 90 ]; do
            deployment_id="$(gh api -X GET "repos/$GITHUB_REPOSITORY/deployments" -f sha="$EXPECTED_SHA" -f per_page=100 --jq ".[] | select(.environment == \"$EXPECTED_ENVIRONMENT\") | .id" | head -n 1)"
            if [ -n "$deployment_id" ]; then
              deployment_url="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[] | select(.state == "success") | .environment_url' | head -n 1)"
              [ -n "$deployment_url" ] && break
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          [ -n "$deployment_id" ]
          [ -n "$deployment_url" ]
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" --jq .sha)" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" --jq .environment)" = "$EXPECTED_ENVIRONMENT"
          case "$deployment_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          if [ "$EXPECTED_ENVIRONMENT" = Production ]; then
            curl --fail --silent --show-error --location --max-time 30 "https://new.autograph.so/healthz" > health.json
            curl --fail --silent --show-error --location --max-time 30 "https://new.autograph.so/.well-known/oauth-protected-resource" > oauth-resource.json
            jq -e '.resource == "https://new.autograph.so/mcp" and (.authorization_servers | length == 1)' oauth-resource.json
            contract="canonical-public-contract"
          else
            # Vercel Deployment Protection intentionally prevents an
            # unauthenticated GitHub runner from probing a Preview URL. The
            # provider-owned exact-SHA success record is the Preview gate; no
            # static bypass credential is introduced.
            contract="provider-deployment-status"
          fi
          jq -n --arg sha "$EXPECTED_SHA" --arg environment "$EXPECTED_ENVIRONMENT" --arg url "$deployment_url" --arg contract "$contract" \
            '{format:"autograph-vercel-deployment-proof-v1",sha:$sha,environment:$environment,url:$url,contract:$contract}' > vercel-deployment-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-deployment-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: vercel-deployment-proof.json
          if-no-files-found: error

  check:
    if: ${{ always() }}
    needs:
      - repository
      - eve-general
      - product-quality
      - eve-fresh-bootstrap
      - sandbox-toolchain
      - package-build
      - auth-e2e-emulated
      - vercel-preview
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        run: |
          test "${{ needs.repository.result }}" = success
          test "${{ needs.eve-general.result }}" = success
          test "${{ needs.product-quality.result }}" = success
          test "${{ needs.eve-fresh-bootstrap.result }}" = success
          test "${{ needs.sandbox-toolchain.result }}" = success
          test "${{ needs.package-build.result }}" = success
          test "${{ needs.auth-e2e-emulated.result }}" = success
          test "${{ needs.vercel-preview.result }}" = success

  promote:
    name: Publish exact main package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check, vercel-preview]
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only an unreleased package version
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        if: steps.release_state.outputs.publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.release_state.outputs.publish == 'true'
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
        if: steps.release_state.outputs.publish == 'true'
      - uses: actions/download-artifact@v4
        if: steps.release_state.outputs.publish == 'true'
        with:
          name: vercel-deployment-proof-${{ github.sha }}
          path: .artifacts/deployment-proof
      - name: Build and seal exact release bytes once
        if: steps.release_state.outputs.publish == 'true'
        run: |
          deployment_url="$(jq -r .url .artifacts/deployment-proof/vercel-deployment-proof.json)"
          mise run release:prove -- \
            --endpoint https://new.autograph.so \
            --deployment-url "$deployment_url" \
            --output "$PWD/.artifacts/promotion"
      - name: Attest immutable release assets
        if: steps.release_state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            .artifacts/promotion/package/*.tar.gz
            .artifacts/promotion/package/release-receipt.json
            .artifacts/promotion/package/SHA256SUMS
            .artifacts/promotion/promotion-receipt.json
      - name: Publish exact prerelease bytes
        if: steps.release_state.outputs.publish == 'true'
        env:
          APP_BUILDER_RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: mise run release:publish -- --candidate-root "$PWD/.artifacts/promotion"
