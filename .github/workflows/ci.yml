name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run storybook:install-browser
      - run: mise run ci-repository

  eve-general:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-eve-general

  eve-fresh-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-eve-fresh-bootstrap

  sandbox-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-sandbox-toolchain

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: mise run dependencies:install
      - run: mise run ci-package-build

  check:
    if: ${{ always() }}
    needs:
      - repository
      - eve-general
      - eve-fresh-bootstrap
      - sandbox-toolchain
      - package-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        run: |
          test "${{ needs.repository.result }}" = success
          test "${{ needs.eve-general.result }}" = success
          test "${{ needs.eve-fresh-bootstrap.result }}" = success
          test "${{ needs.sandbox-toolchain.result }}" = success
          test "${{ needs.package-build.result }}" = success
